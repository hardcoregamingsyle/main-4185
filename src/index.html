<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            image-rendering: pixelated;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .hud-element {
            position: absolute;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
            font-size: 18px;
        }
        
        #score-display {
            top: 10px;
            left: 10px;
        }
        
        #health-display {
            top: 10px;
            right: 10px;
        }
        
        #controls-hint {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0.7;
            text-align: center;
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
        }
        
        .hidden {
            display: none !important;
        }
        
        h1 {
            color: #00ffcc;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffcc;
        }
        
        p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        button {
            background: linear-gradient(to bottom, #00ffcc, #0099aa);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: linear-gradient(to bottom, #00ffee, #00bbdd);
            transform: scale(1.05);
        }
        
        .key {
            display: inline-block;
            background: #333;
            padding: 2px 8px;
            border-radius: 3px;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div id="score-display" class="hud-element">Score: 0</div>
            <div id="health-display" class="hud-element">Health: ♥♥♥♥♥</div>
            <div id="controls-hint" class="hud-element">
                Move: <span class="key">←</span><span class="key">→</span> or <span class="key">A</span><span class="key">D</span> | 
                Jump: <span class="key">↑</span> or <span class="key">W</span> or <span class="key">Space</span>
            </div>
        </div>
        <div id="overlay">
            <h1>PIXEL PLATFORMER</h1>
            <p>Navigate through dangerous platforms, collect coins, and survive!</p>
            <p>Avoid enemies and reach the exit portal.</p>
            <button id="start-btn">START GAME</button>
            <button id="how-to-play-btn">HOW TO PLAY</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
