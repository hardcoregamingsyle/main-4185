<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 100%);
        }
        
        canvas {
            display: block;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
        }
        
        .health-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4444, #ff8844);
            transition: width 0.3s ease;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
        }
        
        .hidden {
            display: none !important;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
        }
        
        button {
            padding: 15px 40px;
            font-size: 20px;
            font-family: inherit;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        button:hover {
            transform: scale(1.05);
            background: #45a049;
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="ui-layer">
            <div class="hud">
                Score: <span id="score">0</span> | Coins: <span id="coins">0</span>
            </div>
            
            <div class="health-bar">
                <div class="health-fill" id="health-fill" style="width: 100%;"></div>
            </div>
            
            <div class="controls-hint">
                WASD/Arrows: Move | Space/Jump: Jump | R: Restart
            </div>
            
            <div id="start-screen" class="overlay">
                <h1>PIXEL PLATFORMER</h1>
                <button id="start-btn">Start Game</button>
            </div>
            
            <div id="game-over-screen" class="overlay hidden">
                <h1>GAME OVER</h1>
                <p>Score: <span id="final-score">0</span></p>
                <br>
                <button id="restart-btn">Try Again</button>
            </div>
            
            <div id="win-screen" class="overlay hidden">
                <h1>YOU WIN!</h1>
                <p>Final Score: <span id="win-score">0</span></p>
                <br>
                <button id="play-again-btn">Play Again</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
